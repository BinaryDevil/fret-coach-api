services:
  postgres:
    image: postgres:17-alpine
    container_name: fret-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fret_coach
      POSTGRES_USER: fret_coach
      POSTGRES_PASSWORD: fret_coach
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fret_coach -d fret_coach']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
